<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>話題ガチャ｜のみゲー！</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
<link rel="stylesheet" href="../../assets/common.css">
<style>
  .label { color: var(--sub); font-size: .85rem; font-weight: 700; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cats button { border: 2px solid var(--line); background: var(--bg2); color: var(--sub); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: .9rem; }
  .cats button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }

  /* ガチャマシン */
  .machine { display: grid; justify-items: center; padding-top: 8px; user-select: none; }
  .globe {
    position: relative; width: 190px; height: 190px; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 30% 25%, #ffffff40 0, #ffffff10 30%, #ffffff08 60%), #1b1640;
    border: 6px solid #cfc8f5; box-shadow: inset 0 -10px 30px #0008;
  }
  .globe .ball { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(var(--c) 50%, #f3f0ff 50%); box-shadow: inset -4px -6px 8px #0003; }
  .globe.shake .ball { animation: jiggle .25s infinite alternate; }
  .globe.shake .ball:nth-child(2n) { animation-duration: .2s; animation-direction: alternate-reverse; }
  @keyframes jiggle { from { transform: translate(-3px, 2px) rotate(-12deg); } to { transform: translate(3px, -4px) rotate(14deg); } }
  .body {
    position: relative; width: 210px; height: 120px; margin-top: -10px; border-radius: 18px 18px 10px 10px;
    background: linear-gradient(#ff6f98, #e04473); border: 4px solid #ffb3c8; box-shadow: 0 8px 0 #0004;
  }
  .handle {
    position: absolute; left: 50%; top: 20px; width: 62px; height: 62px; margin-left: -31px; border-radius: 50%;
    background: #fff4d0; border: 4px solid var(--accent); transition: transform .6s cubic-bezier(.5, -0.3, .4, 1.4);
  }
  .handle::before { content: ''; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 14px; margin-left: -7px; border-radius: 7px; background: var(--accent); }
  .outlet { position: absolute; left: 14px; bottom: 10px; width: 54px; height: 30px; border-radius: 10px 10px 4px 4px; background: #2b0f1d; box-shadow: inset 0 6px 8px #000a; }
  .tray { position: relative; width: 100%; max-width: 320px; height: 130px; overflow: hidden; }

  /* カプセル */
  .capsule { position: absolute; left: calc(50% - 128px); top: -40px; width: 76px; height: 76px; opacity: 0; --cap: var(--cyan); }
  .capsule .half { position: absolute; left: 0; width: 76px; height: 38px; }
  .capsule .top { top: 0; border-radius: 38px 38px 0 0; background: var(--cap); box-shadow: inset -6px 6px 10px #fff5, inset 6px -2px 8px #0002; }
  .capsule .bottom { bottom: 0; border-radius: 0 0 38px 38px; background: #f3f0ff; box-shadow: inset -6px -6px 10px #0002; }
  .capsule .band { position: absolute; left: -2px; right: -2px; top: 35px; height: 6px; border-radius: 3px; background: #0003; }
  .capsule.r { --cap: var(--pink); }
  .capsule.ssr { --cap: linear-gradient(135deg, #ffe066, #ff9f1c 40%, #ff5c8a 70%, #b06bff); filter: drop-shadow(0 0 14px #ffcc33); }
  .capsule.roll { animation: roll .9s cubic-bezier(.3, .6, .4, 1) forwards; }
  .capsule.wobble { left: calc(50% - 38px); top: 40px; opacity: 1; animation: wobble .18s 4 alternate; }
  .capsule.ssr.wobble { animation: wobble .1s 14 alternate; }
  .capsule.open { left: calc(50% - 38px); top: 40px; opacity: 1; }
  .capsule.open .top { animation: lid .5s ease-out forwards; }
  .capsule.open .bottom { animation: base .5s ease-out forwards; }
  .capsule.open .band { opacity: 0; }
  @keyframes roll {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    45% { transform: translate(40px, 80px) rotate(200deg); }
    65% { transform: translate(70px, 60px) rotate(300deg); }
    82% { transform: translate(84px, 80px) rotate(340deg); }
    100% { opacity: 1; transform: translate(90px, 80px) rotate(360deg); }
  }
  @keyframes wobble { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  @keyframes lid { to { transform: translate(-30px, -50px) rotate(-40deg); opacity: 0; } }
  @keyframes base { to { transform: translate(20px, 30px) rotate(20deg); opacity: 0; } }
  .burst { position: absolute; left: 50%; top: 78px; width: 10px; height: 10px; margin: -5px; border-radius: 50%; opacity: 0; pointer-events: none; }
  .burst.go { animation: burst .7s ease-out; }
  @keyframes burst { 0% { opacity: .9; box-shadow: 0 0 0 0 var(--bc); } 100% { opacity: 0; box-shadow: 0 0 0 90px transparent; } }

  .flash { position: fixed; inset: 0; z-index: 90; pointer-events: none; background: radial-gradient(circle, #fff6 0, #ffcc33aa 40%, #ff5c8a55 70%, transparent 100%); animation: flash 1s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

  /* 結果 */
  .result { text-align: center; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .result.r { border-color: var(--pink); }
  .result.ssr { border: 2px solid var(--accent); background: linear-gradient(160deg, #3d2f12, var(--card) 45%, #3a1f45); box-shadow: 0 0 24px #ffcc3355; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .rarity { display: inline-block; padding: 2px 12px; border-radius: 999px; font-weight: 900; font-size: .85rem; letter-spacing: .05em; background: var(--cyan); color: #06302c; }
  .rarity.r { background: var(--pink); color: #fff; }
  .rarity.ssr { background: linear-gradient(90deg, #ffe066, #ff9f1c, #ff5c8a); color: #2b1d00; }
  .theme { font-size: clamp(1.3rem, 5.6vw, 1.8rem); font-weight: 900; line-height: 1.45; margin: 10px 0 6px; word-break: break-word; }
  .speaker { font-weight: 700; color: var(--accent); }
  .stat { text-align: center; color: var(--sub); font-size: .85rem; }
</style>
</head>
<body>
<header class="g-header">
  <a class="back" href="../../">← 一覧</a>
  <h1>🎰 話題ガチャ</h1>
  <button class="btn small" id="soundBtn" aria-pressed="true">🔊 音あり</button>
</header>

<main class="g-main stack">
  <div class="machine" aria-hidden="true">
    <div class="globe" id="globe"></div>
    <div class="body">
      <div class="handle" id="handle"></div>
      <div class="outlet"></div>
    </div>
    <div class="tray">
      <div class="capsule" id="capsule"><div class="half top"></div><div class="half bottom"></div><div class="band"></div></div>
      <div class="burst" id="burst"></div>
    </div>
  </div>

  <button class="btn big primary" id="spinBtn">ガチャを回す 🎰</button>

  <section class="card result hidden" id="result" aria-live="polite">
    <span class="rarity" id="rarity"></span>
    <span class="chip" id="resCat"></span>
    <div class="theme" id="theme"></div>
    <div class="speaker hidden" id="speaker"></div>
  </section>
  <p class="stat" id="stat"></p>

  <div class="card stack">
    <span class="label">カテゴリ（複数選択OK）</span>
    <div class="cats" id="cats"></div>
  </div>

  <div class="card stack">
    <label class="check"><input type="checkbox" id="pickSpeaker"> 話す人もランダムで決める</label>
    <textarea class="field" id="names" rows="2" placeholder="参加者の名前をスペースか改行で区切って入力（任意）"></textarea>
    <span class="note">名前が空のときは話す人を決めずにテーマだけ出します。</span>
  </div>

  <div class="card note">
    <b>遊び方</b><br>
    ガチャを回して出たテーマについて、みんなで話そう。カプセルの色でレア度がわかります
    （<b style="color:var(--cyan)">ノーマル</b>・<b style="color:var(--pink)">レア</b>・<b style="color:var(--accent)">SSR</b>）。
    SSRはちょっと深めの話題。話したくないテーマはパスしてOK！一度出たテーマは全部出きるまで出ません。
  </div>
</main>

<script>
(() => {
  // n: ノーマル / r: レア / ssr: SSR
  const CATS = [
    { id: 'hello', name: 'はじめまして向け', emoji: '👋',
      n: ['出身地の自慢できるところは？', '休日は何をして過ごすことが多い？', '最近ハマっている食べ物は？', '朝型？夜型？', '好きな季節とその理由は？',
        '通勤中にしていることは？', '最近買ってよかったものは？', 'ペットを飼うなら何がいい？', '得意料理、または好きな料理は？', 'ついつい行ってしまうお店は？',
        '自分の名前の由来を知ってる？', '犬派？猫派？それ以外？', '最近見た映画やドラマは？'],
      r: ['自分を動物に例えると何？', '周りからよく言われる第一印象は？', '意外な特技はある？', '今年中にやってみたいことは？',
        '自己紹介の鉄板ネタは？', '実はちょっと自慢できることは？'],
      ssr: ['人生で一番「やってよかった」と思っていることは？', '10年前の自分に一言かけるなら？', '自分の性格で一番気に入っているところは？'] },
    { id: 'work', name: '仕事・職場', emoji: '💼',
      n: ['集中したいときにやることは？', '愛用している仕事道具は？', 'ランチでよく行くお店は？', '在宅勤務と出社、どっち派？', '仕事が終わって最初にすることは？',
        'デスク周りのこだわりは？', '最近覚えた便利な仕事術やショートカットは？', '社会人になってから始めた習慣は？', '一週間で好きな曜日とその理由は？',
        '仕事中に飲むものの定番は？', '忙しい時期の乗り切り方は？', '入社したばかりの頃の思い出は？', '職場の近くのおすすめスポットは？'],
      r: ['新人の頃の失敗談（笑える範囲で）', '仕事で「助かった！」と思った誰かの一言は？', '別の部署で1週間働けるならどこ？', '会社に新しい制度を1つ作れるなら？',
        '子どもの頃の夢と今の仕事、つながってる？', 'これまでで一番うれしかった仕事の瞬間は？'],
      ssr: ['仕事で大切にしている自分なりのルールは？', '5年後、どんな働き方をしていたい？', '尊敬する先輩や上司から学んだことは？'] },
    { id: 'if', name: 'もしも', emoji: '🔮',
      n: ['宝くじで1億円当たったら最初に何をする？', '1日だけ動物になれるなら何になる？', '無人島に1つだけ持っていくなら？', 'タイムマシンがあったら過去と未来どっちに行く？',
        '魔法を1つだけ使えるなら？', '一生1つの料理しか食べられないなら何にする？', '歴史上の人物と食事できるなら誰？', '明日から1か月休みになったら何をする？',
        '住む場所をどこでも選べるならどこ？', '自分の部屋に設備を1つ追加できるなら？', '動物と話せるなら何と話したい？', '1日だけ別の職業を体験できるなら？',
        '自分専用のロボットがいたら何を頼む？'],
      r: ['自分の人生が映画になったらタイトルは？', '世界のルールを1つだけ変えられるなら？', '自分のクローンがいたら何を任せる？', '今の記憶のまま中学生に戻ったら何をする？',
        '好きな漫画やアニメの世界に入れるなら？', '100年後の世界に1日行けたら見たいものは？'],
      ssr: ['人生をもう一度やり直せるとしたら、同じ道を選ぶ？', '寿命が1000年あったら何をする？', '明日世界が終わるなら、最後の1日をどう過ごす？'] },
    { id: 'memory', name: '思い出・子ども時代', emoji: '🎒',
      n: ['好きだった給食のメニューは？', '小学生の頃に流行っていた遊びは？', '子どもの頃の習い事は？', '夏休みの思い出といえば？', '初めて買ってもらったゲームやおもちゃは？',
        '学生時代の部活動は？', '修学旅行の行き先と思い出は？', '子どもの頃に好きだったテレビ番組は？', '好きだった駄菓子は？', '子どもの頃の夢は？',
        '学生時代によく行ったお店は？', '覚えている一番古い記憶は？', '子どもの頃の得意科目・苦手科目は？'],
      r: ['子どもの頃に信じていた不思議なことは？', '親や先生に怒られた思い出（笑える範囲で）', '子どもの頃の宝物は？', '学生時代の一番の挑戦は？',
        '初めてのアルバイトの思い出は？', '昔の自分が今の自分を見たら驚くことは？'],
      ssr: ['子どもの頃の自分に、今なら言ってあげたいことは？', '人生の転機になった出来事は？', '今の自分をつくった思い出の1シーンは？'] },
    { id: 'like', name: '好き・こだわり', emoji: '💖',
      n: ['好きなコンビニスイーツは？', '目玉焼きに何をかける？', '休日の朝ごはんの定番は？', 'お気に入りの飲み物は？', 'よく聴く音楽のジャンルは？',
        '好きなおにぎりの具は？', 'ラーメンは何味派？', '旅行先で必ずすることは？', 'スマホで一番使うアプリは？', '寝る前の習慣は？',
        '好きなお寿司のネタ ベスト3は？', 'カレーのこだわりは？', '好きな季節のイベントは？'],
      r: ['これだけはお金をかけたいものは？', '人にすすめたい本・漫画・映画は？', '自分だけの小さなこだわりは？', '最近一番感動したものは？',
        '一生推せると思うものは？', '座右の銘や好きな言葉は？'],
      ssr: ['これからずっと続けていきたいことは？', '一番「自分らしい」と感じる瞬間は？', '人生で一番影響を受けた作品は？'] },
    { id: 'deep', name: 'ちょっと深い話', emoji: '🌙',
      n: ['最近ちょっとうれしかったことは？', 'おすすめのストレス発散方法は？', '最近「成長したな」と思ったことは？', '元気が出る食べ物や場所は？', '1人の時間は何をしている？',
        '最近学んだことは？', '尊敬している人は？（有名人でもOK）', '自分へのご褒美といえば？', '最近始めてみたいと思っていることは？', '落ち込んだときの立ち直り方は？',
        '最近気になっている明るいニュースは？'],
      r: ['自分の長所と短所を1つずつ', '人から言われて一番うれしかった言葉は？', '苦手を克服した経験は？', '「これだけは譲れない」ことは？',
        '今の自分に点数をつけるなら何点？', '人生で一番がんばった時期は？'],
      ssr: ['自分にとっての「幸せ」とは？', 'これから叶えたい夢や目標は？', '一番影響を受けた人とその理由は？', '最後に食べたいご飯とその理由は？',
        '自分が大切にしている価値観は？', '今、一番感謝を伝えたい人は？'] },
  ];
  const RARITY = {
    n: { label: 'ノーマル', weight: 70 },
    r: { label: 'レア', weight: 22 },
    ssr: { label: 'SSR', weight: 8 },
  };
  const ALL = CATS.flatMap(c => ['n', 'r', 'ssr'].flatMap(r => c[r].map(text => ({ cat: c, rarity: r, text, key: c.id + ':' + text }))));

  const $ = s => document.querySelector(s);
  const used = new Set();
  let sel = new Set();
  let sound = true;
  let busy = false;
  let lastKey = '', lastSpeaker = '';
  let ctx = null;

  try {
    sound = localStorage.getItem('nomige-sound') !== 'off';
    const saved = JSON.parse(localStorage.getItem('nomige-topic-gacha') || '{}');
    if (Array.isArray(saved.cats)) sel = new Set(saved.cats.filter(id => CATS.some(c => c.id === id)));
    if (typeof saved.names === 'string') $('#names').value = saved.names;
    $('#pickSpeaker').checked = !!saved.pickSpeaker;
  } catch (e) { /* 保存データなしでも動く */ }

  function save() {
    try {
      localStorage.setItem('nomige-topic-gacha', JSON.stringify({ cats: [...sel], names: $('#names').value, pickSpeaker: $('#pickSpeaker').checked }));
    } catch (e) { /* 保存不可でも動く */ }
  }

  const pool = () => ALL.filter(t => sel.size === 0 || sel.has(t.cat.id));
  const names = () => $('#names').value.split(/[\s,、，]+/).map(s => s.trim()).filter(Boolean);

  function renderCats() {
    const html = [`<button data-id="" class="${sel.size === 0 ? 'on' : ''}">🎲 おまかせ</button>`]
      .concat(CATS.map(c => `<button data-id="${c.id}" class="${sel.has(c.id) ? 'on' : ''}">${c.emoji} ${c.name}</button>`));
    $('#cats').innerHTML = html.join('');
    $('#cats').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.classList.contains('on'))));
    renderStat();
  }
  function renderStat(msg) {
    const p = pool();
    const left = p.filter(t => !used.has(t.key)).length;
    $('#stat').textContent = (msg ? msg + ' ' : '') + `残り ${left} / ${p.length} テーマ`;
  }
  function renderSound() {
    $('#soundBtn').textContent = sound ? '🔊 音あり' : '🔇 音なし';
    $('#soundBtn').setAttribute('aria-pressed', String(sound));
  }
  function renderGlobe() {
    const colors = ['var(--cyan)', 'var(--pink)', 'var(--cyan)', 'var(--accent)', 'var(--cyan)', 'var(--pink)', 'var(--green)', 'var(--cyan)', 'var(--pink)'];
    const spots = [[18, 100], [62, 112], [106, 104], [36, 62], [84, 70], [124, 58], [8, 34], [60, 20], [110, 16]];
    $('#globe').innerHTML = spots.map(([x, y], i) => `<div class="ball" style="left:${x}px;top:${y}px;--c:${colors[i]};transform:rotate(${i * 47}deg)"></div>`).join('');
  }

  // ---------- 効果音（WebAudio） ----------
  function audio() {
    if (!sound) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function beep(freq, dur, vol, delay = 0, type = 'triangle') {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur);
  }
  const fanfare = {
    n: [[660, 0]],
    r: [[660, 0], [880, .1]],
    ssr: [[523, 0], [659, .1], [784, .2], [1047, .3], [1319, .45]],
  };

  // ---------- 抽選 ----------
  function draw() {
    const p = pool();
    let avail = p.filter(t => !used.has(t.key));
    let msg = '';
    if (avail.length === 0) {
      p.forEach(t => used.delete(t.key));
      avail = p.filter(t => t.key !== lastKey);
      if (avail.length === 0) avail = p;
      msg = '全部出たのでリセットしました！';
    }
    let roll = Math.random() * 100, rarity = 'n';
    for (const r of ['ssr', 'r', 'n']) {
      if (roll < RARITY[r].weight) { rarity = r; break; }
      roll -= RARITY[r].weight;
    }
    // 引いたレア度が残っていなければ近いレア度から選ぶ
    const order = { n: ['n', 'r', 'ssr'], r: ['r', 'n', 'ssr'], ssr: ['ssr', 'r', 'n'] }[rarity];
    let cand = [];
    for (const r of order) {
      cand = avail.filter(t => t.rarity === r);
      if (cand.length) break;
    }
    const t = cand[Math.floor(Math.random() * cand.length)];
    used.add(t.key);
    lastKey = t.key;
    return { t, msg };
  }
  function pickSpeaker() {
    const list = names();
    if (!$('#pickSpeaker').checked || list.length === 0) return '';
    let s;
    do { s = list[Math.floor(Math.random() * list.length)]; } while (s === lastSpeaker && list.length > 1);
    lastSpeaker = s;
    return s;
  }

  const wait = ms => new Promise(res => setTimeout(res, ms));

  async function spin() {
    if (busy) return;
    busy = true;
    $('#spinBtn').disabled = true;
    const { t, msg } = draw();
    const speaker = pickSpeaker();
    const cap = $('#capsule');

    $('#result').classList.add('hidden');
    cap.className = 'capsule';
    $('#handle').style.transform = `rotate(${(Number($('#handle').dataset.deg) || 0) + 360}deg)`;
    $('#handle').dataset.deg = (Number($('#handle').dataset.deg) || 0) + 360;
    $('#globe').classList.add('shake');
    [0, .12, .24, .36].forEach(d => beep(300 + d * 400, .06, .06, d, 'square'));
    await wait(650);
    $('#globe').classList.remove('shake');

    void cap.offsetWidth;
    cap.className = 'capsule roll ' + t.rarity;
    beep(220, .08, .08, .35); beep(200, .08, .06, .6); beep(240, .06, .05, .78);
    await wait(950);

    cap.className = 'capsule wobble ' + t.rarity;
    await wait(t.rarity === 'ssr' ? 1500 : 760);

    cap.className = 'capsule open ' + t.rarity;
    const burst = $('#burst');
    burst.style.setProperty('--bc', t.rarity === 'ssr' ? '#ffcc33' : t.rarity === 'r' ? '#ff5c8a' : '#3ee0d0');
    burst.classList.remove('go'); void burst.offsetWidth; burst.classList.add('go');
    fanfare[t.rarity].forEach(([f, d]) => beep(f, .25, .1, d));
    if (t.rarity === 'ssr') {
      const fl = document.createElement('div');
      fl.className = 'flash';
      document.body.appendChild(fl);
      setTimeout(() => fl.remove(), 1100);
      try { if (navigator.vibrate) navigator.vibrate([80, 60, 160]); } catch (e) { /* 振動非対応 */ }
    }
    await wait(350);

    $('#rarity').textContent = RARITY[t.rarity].label;
    $('#rarity').className = 'rarity ' + t.rarity;
    $('#resCat').textContent = t.cat.emoji + ' ' + t.cat.name;
    $('#theme').textContent = t.text;
    $('#speaker').textContent = speaker ? `🎤 ${speaker} さんから話そう！` : '';
    $('#speaker').classList.toggle('hidden', !speaker);
    $('#result').className = 'card result ' + t.rarity;
    renderStat(msg);
    $('#spinBtn').textContent = 'もう一回まわす 🎰';
    $('#spinBtn').disabled = false;
    busy = false;
  }

  $('#spinBtn').addEventListener('click', spin);
  $('#cats').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (!b.dataset.id) sel.clear();
    else if (sel.has(b.dataset.id)) sel.delete(b.dataset.id);
    else sel.add(b.dataset.id);
    // 全部選んだらおまかせと同じ扱い
    if (sel.size === CATS.length) sel.clear();
    renderCats();
    save();
  });
  $('#names').addEventListener('input', save);
  $('#pickSpeaker').addEventListener('change', save);
  $('#soundBtn').addEventListener('click', () => {
    sound = !sound;
    try { localStorage.setItem('nomige-sound', sound ? 'on' : 'off'); } catch (e) { /* 保存不可でも動く */ }
    renderSound();
  });

  renderGlobe();
  renderCats();
  renderSound();
})();
</script>
</body>
</html>
