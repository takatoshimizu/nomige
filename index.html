<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>のみゲー！</title>
<meta name="description" content="飲み会ですぐ遊べるブラウザゲーム集。スマホ1台で、登録もアプリも不要。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍻</text></svg>">
<link rel="stylesheet" href="assets/common.css">
<style>
  .hero { text-align: center; padding: 36px 16px 8px; }
  .hero h1 { margin: 0; font-size: clamp(2.2rem, 9vw, 3.4rem); letter-spacing: .04em; line-height: 1.15; }
  .hero h1 span { color: var(--accent); }
  .hero p { margin: 8px 0 0; color: var(--sub); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 20px 0 8px; }
  .filters button {
    border: 2px solid var(--line); background: var(--bg2); color: var(--sub); border-radius: 999px;
    padding: 6px 14px; font-weight: 700;
  }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
  .game {
    display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
    position: relative; overflow: hidden; transition: transform .12s, border-color .12s;
  }
  .game::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
  .game:hover { transform: translateY(-2px); border-color: var(--c); }
  .game .top { display: flex; align-items: center; gap: 12px; }
  .game .emoji {
    font-size: 2rem; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px;
    background: color-mix(in srgb, var(--c) 22%, transparent); flex: none;
  }
  .game h2 { margin: 0; font-size: 1.15rem; }
  .game .meta { color: var(--sub); font-size: .85rem; }
  .game p { margin: 0; color: var(--sub); font-size: .92rem; flex: 1; }
  .game .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--sub); padding: 32px 0; }
  footer { text-align: center; color: var(--sub); font-size: .8rem; padding: 24px 16px 40px; }
</style>
</head>
<body>
  <header class="hero">
    <h1>🍻 のみゲー<span>！</span></h1>
    <p>飲み会ですぐ遊べるゲーム集。スマホ1台、登録もアプリも不要。</p>
  </header>

  <main class="g-main" style="max-width: 980px">
    <div class="filters" id="filters" role="group" aria-label="人数で絞り込み"></div>
    <div class="grid" id="grid"></div>
    <p class="empty hidden" id="empty">この人数で遊べるゲームはまだありません</p>
  </main>

  <footer>
    お酒は無理せず楽しく。罰ゲームはソフトドリンクでもOK。20歳未満の飲酒・飲酒運転は法律で禁止されています。
  </footer>

<script src="assets/games.js"></script>
<script>
(() => {
  const FILTERS = [
    { label: 'すべて', test: () => true },
    { label: '2人でも', test: g => g.minPlayers <= 2 },
    { label: '3〜5人', test: g => g.minPlayers <= 5 && g.maxPlayers >= 3 },
    { label: '6人以上', test: g => g.maxPlayers >= 6 },
  ];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const games = window.GAMES || [];
  let current = 0;
  try { current = Math.min(FILTERS.length - 1, Math.max(0, +localStorage.getItem('nomige-filter') || 0)); } catch (e) { current = 0; }

  function render() {
    document.getElementById('filters').innerHTML = FILTERS.map((f, i) =>
      `<button class="${i === current ? 'on' : ''}" data-i="${i}" aria-pressed="${i === current}">${f.label}</button>`).join('');
    const list = games.filter(FILTERS[current].test);
    document.getElementById('grid').innerHTML = list.map(g => `
      <a class="game" href="${esc(g.path)}" style="--c:${esc(g.color)}">
        <div class="top">
          <span class="emoji" aria-hidden="true">${g.emoji}</span>
          <div><h2>${esc(g.title)}</h2><div class="meta">👥 ${esc(g.players)}　⏱ ${esc(g.time)}</div></div>
        </div>
        <p>${esc(g.desc)}</p>
        <div class="tags">${g.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
      </a>`).join('');
    document.getElementById('empty').classList.toggle('hidden', list.length > 0);
  }
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    current = +b.dataset.i;
    try { localStorage.setItem('nomige-filter', current); } catch (err) { /* 保存できなくても絞り込みは動く */ }
    render();
  });
  render();
})();
</script>
</body>
</html>
